<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
<title id="title">Four connected research sets</title>
<desc id="desc">Four conceptual research sets. An atmospheric outer circle is AI and Computational Social Science (AI and CSS). It contains three overlapping circles: Child Development, Education, and Climate. Its open region outside the inner circles represents standalone AI and CSS research. Areas are not proportional to project counts.</desc>
<defs><radialGradient id="atmosphere" cx="50%" cy="42%" r="62%"><stop offset="0%" stop-color="#f8faff"/><stop offset="100%" stop-color="#e7edf7"/></radialGradient></defs>
<circle cx="600" cy="430" r="405" fill="url(#atmosphere)" stroke="#9bacc7" stroke-opacity="0.72" stroke-width="2.2" aria-label="AI and Computational Social Science"/>
<circle cx="470" cy="300" r="185" fill="#a5bfdf" fill-opacity="0.56" stroke="#466a9a" stroke-opacity="0.68" stroke-width="2" aria-label="Child Development"/>
<circle cx="730" cy="300" r="185" fill="#a6cfcc" fill-opacity="0.56" stroke="#40797c" stroke-opacity="0.68" stroke-width="2" aria-label="Education"/>
<circle cx="600" cy="485" r="185" fill="#d9dbb4" fill-opacity="0.56" stroke="#7b824a" stroke-opacity="0.68" stroke-width="2" aria-label="Climate"/>
<g fill="#24364b" font-family="Georgia, Cambria, serif" text-anchor="middle">
<text x="430" y="264" font-size="36">Child</text>
<text x="430" y="306" font-size="36">Development</text>
<text x="775" y="306" font-size="36">Education</text>
<text x="600" y="535" font-size="36">Climate</text>
</g>
<text x="600" y="762" text-anchor="middle" fill="#3d557a" font-family="Georgia, Cambria, serif" font-size="36">AI and CSS</text>
</svg>
