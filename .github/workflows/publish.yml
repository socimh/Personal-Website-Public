name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: website-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out website structure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Retrieve hosted materials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: socimh/Personal-Website
          ref: main
          path: .private-source
          ssh-key: ${{ secrets.WEBSITE_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: |
            docs/cc-guide
            docs/slides
      - name: Assemble and validate website
        run: >-
          python3 .github/scripts/assemble_site.py
          --private-root .private-source
          --output "${{ runner.temp }}/site"
      - name: Package deployment
        run: >-
          tar --directory "${{ runner.temp }}/site"
          --exclude=.git --exclude=.github --exclude='.[^/]*'
          -cf "${{ runner.temp }}/artifact.tar" .
      - name: Upload deployment
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure website
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Remove deployment download
        if: ${{ always() && needs.build.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
